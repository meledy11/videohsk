<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mia's Mandarin - Sailor Moon Edition 🌙</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Segoe UI', 'Noto Sans SC', sans-serif;
    height: 100vh;
    overflow: hidden; /* Строго без скролла */
    background: linear-gradient(180deg, #fef9f3 0%, #fff5eb 50%, #ffe8d6 100%);
    display: flex;
    flex-direction: column;
    padding: 12px 20px;
}

/* Шапка */
.header {
    text-align: center;
    padding-bottom: 8px;
    flex-shrink: 0;
    position: relative;
}

.header h1 {
    font-size: 1.9em;
    color: #5a3e2b;
    font-weight: 900;
    text-shadow: 2px 2px 0 rgba(255, 214, 165, 0.8);
}

.subtitle {
    font-size: 0.85em;
    color: #8b6f47;
    margin-top: 2px;
}

.day-badge {
    position: absolute;
    top: 0;
    right: 0;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    padding: 5px 14px;
    border-radius: 20px;
    color: white;
    font-weight: bold;
    font-size: 0.85em;
    box-shadow: 0 3px 8px rgba(255, 154, 158, 0.4);
}

/* Верхние кнопки */
.controls {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 10px;
    flex-shrink: 0;
}

.btn {
    padding: 7px 18px;
    border: none;
    border-radius: 20px;
    background: linear-gradient(135deg, #a8edea, #fed6e3);
    color: #5a3e2b;
    font-weight: 700;
    cursor: pointer;
    font-size: 0.85em;
    box-shadow: 0 3px 6px rgba(0,0,0,0.1);
    transition: transform 0.2s;
}

.btn:hover { transform: translateY(-2px); }
.btn:active { transform: scale(0.95); }

/* Сетка карточек: 2 колонки x 3 ряда = 6 карточек */
.grid {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 15px;
    min-height: 0;
    margin-bottom: 10px;
}

/* Карточка */
.card {
    border-radius: 20px;
    padding: 10px;
    cursor: pointer;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 5px 15px rgba(0,0,0,0.08);
    border: 2px solid rgba(255,255,255,0.8);
}

.card:hover {
    transform: translateY(-6px) scale(1.02);
    box-shadow: 0 12px 30px rgba(0,0,0,0.15);
    z-index: 10;
}

.card.playing {
    animation: pulse 0.5s ease;
    border-color: #fff;
    box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.9), 0 12px 30px rgba(0,0,0,0.15);
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.04); }
    100% { transform: scale(1); }
}

/* Номер в кружочке */
.number {
    position: absolute;
    top: 10px;
    left: 10px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: white;
    color: #5a3e2b;
    font-size: 0.85em;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    z-index: 2;
}

/* КРУПНАЯ КАРТИНКА */
.card-img {
    width: 110px;
    height: 110px;
    object-fit: contain;
    margin: 5px 0 10px 0;
    filter: drop-shadow(0 5px 8px rgba(0,0,0,0.15));
    transition: transform 0.3s ease;
}

.card:hover .card-img {
    transform: scale(1.1) rotate(3deg);
}

/* Текст */
.chinese {
    font-size: 1.8em;
    font-weight: 900;
    color: #3d2817;
    line-height: 1;
    margin-bottom: 4px;
}

.pinyin {
    font-size: 0.85em;
    color: #6b4c3a;
    font-weight: 700;
    margin-bottom: 3px;
    letter-spacing: 0.5px;
}

.russian {
    font-size: 0.95em;
    font-weight: 800;
    color: #5a3e2b;
    text-transform: lowercase;
}

/* Цветовые темы карточек */
.c1 { background: linear-gradient(135deg, #d4fc79, #96e6a1); }
.c2 { background: linear-gradient(135deg, #ff9a9e, #fecfef); }
.c3 { background: linear-gradient(135deg, #a8edea, #fed6e3); }
.c4 { background: linear-gradient(135deg, #d299c2, #fef9d7); }
.c5 { background: linear-gradient(135deg, #89f7fe, #66a6ff); }
.c6 { background: linear-gradient(135deg, #fddb92, #d1fdff); }
.c7 { background: linear-gradient(135deg, #ffecd2, #fcb69f); }
.c8 { background: linear-gradient(135deg, #a1c4fd, #c2e9fb); }
.c9 { background: linear-gradient(135deg, #fbc2eb, #a6c1ee); }
.c10 { background: linear-gradient(135deg, #f6d365, #fda085); }
.c11 { background: linear-gradient(135deg, #84fab0, #8fd3f4); }
.c12 { background: linear-gradient(135deg, #a6c0fe, #f68084); }
.c13 { background: linear-gradient(135deg, #fccb90, #d57eeb); }
.c14 { background: linear-gradient(135deg, #e0c3fc, #8ec5fc); }
.c15 { background: linear-gradient(135deg, #f093fb, #f5576c); }
.c16 { background: linear-gradient(135deg, #4facfe, #00f2fe); }

/* Пагинация */
.pagination {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 15px;
    flex-shrink: 0;
    padding-top: 5px;
}

.page-btn {
    padding: 8px 20px;
    border: none;
    border-radius: 20px;
    background: white;
    color: #5a3e2b;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 3px 8px rgba(0,0,0,0.1);
    transition: all 0.2s;
    font-size: 0.9em;
}

.page-btn:hover:not(:disabled) {
    background: #fed6e3;
    transform: translateY(-2px);
}

.page-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

.page-indicator {
    font-weight: 800;
    color: #5a3e2b;
    font-size: 1em;
    background: rgba(255,255,255,0.6);
    padding: 6px 16px;
    border-radius: 15px;
}

.footer {
    text-align: center;
    font-size: 0.75em;
    color: #8b6f47;
    flex-shrink: 0;
    font-weight: 600;
    margin-top: 5px;
}
</style>
</head>
<body>

<div class="header">
    <h1>🌙 Sailor Moon Mandarin</h1>
    <div class="subtitle">Нажми на карточку для озвучки 🔊</div>
    <div class="day-badge">Day 2</div>
</div>

<div class="controls">
    <button class="btn" onclick="speakCurrentPage('cn')">🇨🇳 Китайские</button>
    <button class="btn" onclick="speakCurrentPage('ru')">🇷🇺 Русские</button>
    <button class="btn" onclick="shuffle()">🔀 Микс</button>
</div>

<div class="grid" id="grid"></div>

<div class="pagination">
    <button class="page-btn" id="prevBtn" onclick="changePage(-1)">⬅️ Назад</button>
    <span class="page-indicator" id="pageIndicator">Страница 1 / 3</span>
    <button class="page-btn" id="nextBtn" onclick="changePage(1)">Вперед ➡️</button>
</div>

<div class="footer">Mia's Mandarin © 2026 ✨</div>

<script>
const words = [
    { cn:'安全', py:'ān quán', ru:'безопасный', c:'c1', img:'IMG_7180.png' },
    { cn:'危险', py:'wēi xiǎn', ru:'опасный', c:'c2', img:'IMG_7181.png' },
    { cn:'简单', py:'jiǎn dān', ru:'простой', c:'c3', img:'IMG_7182.png' },
    { cn:'复杂', py:'fù zá', ru:'сложный', c:'c4', img:'IMG_7183.png' },
    { cn:'容易', py:'róng yì', ru:'лёгкий', c:'c5', img:'IMG_7184.png' },
    { cn:'困难', py:'kùn nán', ru:'трудный', c:'c6', img:'IMG_7185.png' },
    { cn:'热闹', py:'rè nao', ru:'оживлённый', c:'c7', img:'IMG_7186.png' },
    { cn:'安静', py:'ān jìng', ru:'тихий', c:'c8', img:'IMG_7187.png' },
    { cn:'便宜', py:'pián yi', ru:'дешёвый', c:'c9', img:'IMG_7188.png' },
    { cn:'昂贵', py:'áng guì', ru:'дорогой', c:'c10', img:'IMG_7189.png' },
    { cn:'成功', py:'chéng gōng', ru:'успех', c:'c11', img:'IMG_7190.png' },
    { cn:'失败', py:'shī bài', ru:'неудача', c:'c12', img:'IMG_7191.png' },
    { cn:'开心', py:'kāi xīn', ru:'счастливый', c:'c13', img:'IMG_7192.png' },
    { cn:'难过', py:'nán guò', ru:'грустный', c:'c14', img:'IMG_7193.png' },
    { cn:'开始', py:'kāi shǐ', ru:'начать', c:'c15', img:'IMG_7194.png' },
    { cn:'结束', py:'jié shù', ru:'закончить', c:'c16', img:'IMG_7195.png' }
];

const imgPath = './img/';
const cardsPerPage = 6;
let currentPage = 0;
let currentWords = [...words];
const totalPages = Math.ceil(currentWords.length / cardsPerPage);

function render() {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    
    const start = currentPage * cardsPerPage;
    const end = start + cardsPerPage;
    const pageWords = currentWords.slice(start, end);
    
    pageWords.forEach((word, index) => {
        const globalIndex = start + index;
        const card = document.createElement('div');
        card.className = `card ${word.c}`;
        card.id = `card-${globalIndex}`;
        card.onclick = () => speakCard(globalIndex);
        
        card.innerHTML = `
            <div class="number">${globalIndex + 1}</div>
            <img src="${imgPath}${word.img}" class="card-img" alt="${word.cn}" onerror="this.style.display='none'">
            <div class="chinese">${word.cn}</div>
            <div class="pinyin">${word.py}</div>
            <div class="russian">${word.ru}</div>
        `;
        
        grid.appendChild(card);
    });
    
    updatePagination();
}

function updatePagination() {
    document.getElementById('pageIndicator').textContent = `Страница ${currentPage + 1} / ${totalPages}`;
    document.getElementById('prevBtn').disabled = currentPage === 0;
    document.getElementById('nextBtn').disabled = currentPage === totalPages - 1;
}

function changePage(direction) {
    const newPage = currentPage + direction;
    if (newPage >= 0 && newPage < totalPages) {
        currentPage = newPage;
        render();
    }
}

function speak(text, lang) {
    if ('speechSynthesis' in window) {
        speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = lang;
        utterance.rate = 0.85;
        utterance.pitch = 1.05;
        speechSynthesis.speak(utterance);
    }
}

function speakCard(index) {
    const word = currentWords[index];
    const card = document.getElementById(`card-${index}`);
    
    card.classList.add('playing');
    setTimeout(() => card.classList.remove('playing'), 600);
    
    speak(word.cn, 'zh-CN');
    setTimeout(() => {
        speak(word.ru, 'ru-RU');
    }, 1100);
}

function speakCurrentPage(lang) {
    const start = currentPage * cardsPerPage;
    const end = Math.min(start + cardsPerPage, currentWords.length);
    let delay = 0;
    
    for (let i = start; i < end; i++) {
        setTimeout(() => {
            const card = document.getElementById(`card-${i}`);
            if (card) {
                card.classList.add('playing');
                setTimeout(() => card.classList.remove('playing'), 600);
            }
            const word = currentWords[i];
            speak(lang === 'cn' ? word.cn : word.ru, lang === 'cn' ? 'zh-CN' : 'ru-RU');
        }, delay);
        delay += 1800;
    }
}

function shuffle() {
    currentWords.sort(() => Math.random() - 0.5);
    currentPage = 0;
    render();
}

// Запуск
render();
</script>
</body>
</html>
